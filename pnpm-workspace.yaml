# Approve post-install build scripts for trusted dependencies only.
# pnpm blocks lifecycle scripts by default; Prisma + esbuild are required by the
# toolchain (client/engine generation; esbuild native binary for Vitest & tsx).
# sharp (next/image optimisation) and unrs-resolver (an eslint import resolver) are
# optional and intentionally NOT built — the app does not depend on them.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: false
  # tesseract.js's only postinstall is an OpenCollective donation banner — skip it.
  tesseract.js: false
  unrs-resolver: false
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - esbuild
