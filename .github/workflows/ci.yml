# CI. The automated test suite was removed by business decision, so what remains is the
# static safety net: the build must compile, types must check, and lint must pass before a
# change reaches Vercel. A dependency vulnerability scan runs alongside (FR-SEC-32).
name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Prisma needs a URL to generate the client; nothing here connects to a database.
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder?schema=public
      DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec next build
      - run: pnpm audit --audit-level=high
        continue-on-error: true   # advisory until the lockfile is triaged
